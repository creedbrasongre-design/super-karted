  function ensureRoot(){let root=document.getElementById(ROOT_ID);if(!root){root=document.createElement('div');root.id=ROOT_ID;document.body.appendChild(root);}return root;}
  function button(label,cls,attrs){return '<button class="kc-btn '+(cls||'')+'" '+(attrs||'')+'>'+label+'</button>';}
  function coolerOn(){return !!((window.NDPerformanceIsCool&&window.NDPerformanceIsCool())||document.body.classList.contains('nd-cool-computer'));}
  function syncCoolerButton(root=ensureRoot()){const b=root.querySelector('[data-act="cooler"]'),on=coolerOn();if(!b)return;b.classList.toggle('on',on);b.textContent='❄ COOL COMPUTER: '+(on?'ON':'OFF');b.setAttribute('aria-pressed',on?'true':'false');}
  function openGame(){
    stopSession(false);try{if(window.NDSuspendNeonDriftRenderer)window.NDSuspendNeonDriftRenderer();}catch(e){}

    root.innerHTML='<section class="kc-screen"><div class="kc-menu"><div><div class="kc-kicker">REAL-TIME 3D ARENA SIEGE</div><h1 class="kc-title">KINGDOM<span>CLASH</span></h1><p class="kc-copy">Your commander remains on the throne platform. Place troops inside your territory, aim spells anywhere, and give attack or defense location orders while your towers guard the stronghold.</p><div class="kc-info"><b>HERO COMMANDS FROM YOUR DESIGN</b><br><b>SUMMON:</b> choose a unit, then place it anywhere in blue territory. <b>CAST:</b> aim anywhere. <b>ATTACK:</b> set a rally location. <b>DEFEND:</b> set a protected hold location.</div></div><aside class="kc-card"><h2>BATTLEFIELD</h2><div class="kc-levels">'+Object.entries(LEVELS).map(([k,l])=>'<button class="kc-level '+(k===selectedLevel?'sel':'')+'" data-level="'+k+'">'+l.name+'<small>'+l.tag+'</small></button>').join('')+'</div><h2>CPU COMMANDER</h2><div class="kc-difficulties">'+button('APPRENTICE',difficulty==='apprentice'?'sel':'', 'data-difficulty="apprentice"')+button('COMMANDER',difficulty==='commander'?'sel':'', 'data-difficulty="commander"')+button('WARLORD',difficulty==='warlord'?'sel':'', 'data-difficulty="warlord"')+'</div><h2 style="margin-top:15px">SCREEN QUALITY</h2><div class="kc-qualities">'+Object.entries(QUALITY_PROFILES).map(([k,q])=>'<button class="kc-quality '+(k===selectedQuality?'sel':'')+'" data-quality="'+k+'">'+q.name+'<small>'+q.fps+' FPS · '+q.scale.toFixed(2)+'× · '+q.maxUnits+' UNITS/SIDE</small></button>').join('')+'</div><button class="kc-btn kc-cooler" data-act="cooler" aria-pressed="false">❄ COOL COMPUTER: OFF</button><div class="kc-info">Lower visual quality frees performance for larger armies. Cool Computer uses Very Low automatically and also cools Neon Drift.</div><div class="kc-buttons">'+button('START BATTLE','primary','data-act="start"')+button('SYSTEM HOME','blue','data-act="home"')+'</div></aside></div></section>';
    root.querySelectorAll('[data-difficulty]').forEach(b=>b.onclick=()=>{difficulty=b.dataset.difficulty;root.querySelectorAll('[data-difficulty]').forEach(x=>x.classList.toggle('sel',x===b));});
    root.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{selectedLevel=b.dataset.level;root.querySelectorAll('[data-level]').forEach(x=>x.classList.toggle('sel',x===b));});
    root.querySelectorAll('[data-quality]').forEach(b=>b.onclick=()=>{selectedQuality=b.dataset.quality;root.querySelectorAll('[data-quality]').forEach(x=>x.classList.toggle('sel',x===b));});
    root.querySelector('[data-act="cooler"]').onclick=()=>{if(window.NDToggleCoolComputer)window.NDToggleCoolComputer();else document.body.classList.toggle('nd-cool-computer');if(coolerOn()){selectedQuality='verylow';root.querySelectorAll('[data-quality]').forEach(x=>x.classList.toggle('sel',x.dataset.quality==='verylow'));}syncCoolerButton(root);};
    syncCoolerButton(root);
    root.querySelector('[data-act="start"]').onclick=startBattle;root.querySelector('[data-act="home"]').onclick=systemHome;
  }
  function systemHome(){stopSession(false);if(window.NDSystem)window.NDSystem.openHome();}
  function stopSession(clearRoot=true){
    if(session&&session.stop)session.stop();session=null;document.body.classList.remove('kc-active');const root=ensureRoot();root.className='';if(clearRoot)root.innerHTML='';
  }
  function startBattle(){
    if(session&&session.stop){session.stop();session=null;}
    if(typeof THREE==='undefined'){showLaunchError('3D ENGINE DID NOT LOAD');return;}
    const root=ensureRoot(),level=LEVELS[selectedLevel]||LEVELS.crossing;root.innerHTML='<main class="kc-battle"><canvas class="kc-canvas" tabindex="0"></canvas><div class="kc-hud"><div class="kc-hudbox"><b>AZURE COMMANDER</b><div class="kc-bar"><i data-player-hp></i></div><span data-player-text></span><div class="kc-bar kc-mana"><i data-player-mana></i></div><span data-mana-text></span></div><div class="kc-hudbox kc-center"><strong data-clock>0:00</strong><br><span data-lane-label>'+level.name+'</span></div><div class="kc-hudbox enemy"><b>EMBER COMMANDER</b><div class="kc-bar red"><i data-enemy-hp></i></div><span data-enemy-text></span><br><span data-enemy-towers></span></div></div><div class="kc-tools">'+button('PAUSE','', 'data-act="pause"')+button('SYSTEM HOME','blue','data-act="home"')+'</div><div class="kc-toast"></div><div class="kc-target-note"></div><div class="kc-toolbar"><button class="kc-mobile-toggle" data-act="toolbar-toggle">HIDE</button><div class="kc-toolbar-body"><div class="kc-lanes">'+LANE_NAMES.map((n,i)=>button(n,i===1?'sel':'','data-lane="'+i+'"')).join('')+'</div><div class="kc-command-row"><div class="kc-command">'+Object.entries(UNIT_DEFS).map(([k,d],i)=>'<button class="kc-action unit" data-unit="'+k+'" title="'+d.role+'">'+(i+1)+' · '+d.name+'<small><b>'+d.cost+' MANA</b><em> · '+d.role+'</em></small></button>').join('')+'</div><div class="kc-command">'+Object.entries(SPELL_DEFS).map(([k,d],i)=>'<button class="kc-action spell" data-spell="'+k+'">'+['Q','W','E','R'][i]+' · '+d.name+'<small><b>'+d.cost+' MANA</b></small></button>').join('')+'</div></div><div class="kc-order-row"><button class="kc-action order attack" data-order="attack">F · SET ATTACK LOCATION</button><button class="kc-action order" data-order="defend">G · SET DEFENSE LOCATION</button></div></div></div><div class="kc-overlay hide"><div class="kc-result"><h2 data-result-title>PAUSED</h2><p data-result-detail>The battle is waiting.</p><div class="kc-buttons" style="justify-content:center"><button class="kc-btn primary" data-act="resume">RESUME</button><button class="kc-btn" data-act="restart">RESTART</button><button class="kc-btn blue" data-act="game-menu">GAME MENU</button></div></div></div></main>';
